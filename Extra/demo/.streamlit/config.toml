# Tema visivo della demo — palette ispirata a atarashigoestosicily.com (estratta dal loro
# styles.css: sfondo quasi nero #0a0a0a/#141414, accento lime #C6F24E, glow arancio #f47825,
# font Space Grotesk/Space Mono). NON tocca i colori dei grafici scientifici (blu/rosso/verde/
# oro in circuit_view.py, bloch_view.py, qpu_view.py, step_view.py): quelli restano quelli già
# usati nelle figure statiche della tesi stampata — qui cambia solo il "chrome" dell'interfaccia.
[theme]
base = "dark"
primaryColor = "#C6F24E"
backgroundColor = "#0a0a0a"
secondaryBackgroundColor = "#141414"
textColor = "#f1eee9"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true
